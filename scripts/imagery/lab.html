<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Imagery lab</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 12px ui-monospace, monospace; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; background: #222; }
  #log { position: fixed; left: 8px; bottom: 8px; background: #000a; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log">ready</div>
<script>
// Cinematic covers for the portfolio, ray-marched in one fragment shader per
// scene and rendered in tiles (so the GPU never stalls long enough to reset).
// Same studio, fog and grade for every scene, so the set reads as one series.

const PRELUDE = `#version 300 es
precision highp float;
uniform vec2 uRes;
out vec4 fragColor;
#define PI 3.14159265

float h13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float h12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec3 h33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return -1.+2.*fract((p.xxy+p.yxx)*p.zyx);}
float gn(vec3 p){
  vec3 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(mix(dot(h33(i),f),dot(h33(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(h33(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(h33(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(h33(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(h33(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(h33(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(h33(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);
}
float fbm(vec3 p,int o){float s=0.,a=.5;for(int i=0;i<8;i++){if(i>=o)break;s+=a*gn(p);p=p*2.02+vec3(1.7,9.2,3.1);a*=.5;}return s;}
float ridged(vec3 p,int o){float s=0.,a=.5;for(int i=0;i<8;i++){if(i>=o)break;float n=1.-abs(gn(p)*1.6);s+=a*n*n;p=p*2.03+vec3(3.1,1.7,7.2);a*=.5;}return s;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdRoundBox(vec3 p,vec3 b,float r){return sdBox(p,b-r)-r;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdCylinder(vec3 p,float h,float r){vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);return min(max(d.x,d.y),0.)+length(max(d,0.));}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}

// The shared studio: a pale cyclorama, a big softbox overhead, a strip light on the left.
vec3 studio(vec3 rd){
  vec3 c=mix(vec3(.62,.645,.67),vec3(.9,.91,.92),smoothstep(-.35,.55,rd.y));
  vec2 sb=rd.xz/max(rd.y,.05);
  float box=(1.-smoothstep(.55,.7,abs(sb.x+.1)))*(1.-smoothstep(.3,.45,abs(sb.y+.15)))*smoothstep(0.,.08,rd.y);
  c+=vec3(6.)*box;
  c+=vec3(2.5)*smoothstep(.975,.995,dot(rd,normalize(vec3(-1.,.3,.35))));
  return c;
}

float gGlow=1e9;   // distance to the scene's emissive part, written by map()
vec2 map(vec3 p);
vec3 calcNormal(vec3 p,float e){
  vec2 k=vec2(1,-1)*e;
  return normalize(k.xyy*map(p+k.xyy).x+k.yyx*map(p+k.yyx).x+k.yxy*map(p+k.yxy).x+k.xxx*map(p+k.xxx).x);
}
float softShadow(vec3 ro,vec3 rd,float k,float tmax){
  float res=1.,t=.02;
  for(int i=0;i<64;i++){float h=map(ro+rd*t).x;res=min(res,k*h/t);t+=clamp(h,.01,.3);if(res<.002||t>tmax)break;}
  return clamp(res,0.,1.);
}
float calcAO(vec3 p,vec3 n){
  float o=0.,s=1.;
  for(int i=0;i<5;i++){float h=.01+.14*float(i)/4.;float d=map(p+n*h).x;o+=(h-d)*s;s*=.9;}
  return clamp(1.-2.4*o,0.,1.);
}
`;

const POST = `
vec3 render(vec2 fc){
  vec2 uv=(fc-.5*uRes)/uRes.y;
  vec3 ro,rd; camera(uv,ro,rd);
  float t=NEAR,m=-1.,glow=0.;
  for(int i=0;i<STEPS;i++){
    vec3 p=ro+rd*t; vec2 h=map(p);
    glow+=exp(-max(gGlow,0.)*GLOWK)*GLOWS*min(h.x,.2);
    if(abs(h.x)<.0003*t){m=h.y;break;}
    t+=h.x*STEPF; if(t>FAR)break;
  }
  vec3 bg=background(rd,uv);
  vec3 col=bg;
  if(m>0.){
    vec3 p=ro+rd*t;
    vec3 n=calcNormal(p,NORMALE);
    col=shade(p,n,rd,m);
    float fogAmt=1.-exp(-FOGK*t*t);
    if(m>1.5&&m<2.5)fogAmt*=.55;
    col=mix(col,fogColor(rd,uv),fogAmt);
  }
  return col+GLOWC*glow;
}
// One sample per pixel: anti-aliasing comes from rendering larger and scaling
// down (an AA loop here gets unrolled by the D3D compiler and never finishes).
void main(){
  vec3 col=render(gl_FragCoord.xy);
  col=aces(col*EXPOSURE);
  vec2 q=gl_FragCoord.xy/uRes;
  col*=.82+.18*pow(16.*q.x*q.y*(1.-q.x)*(1.-q.y),.18);           // vignette
  col=pow(col,vec3(1.04,1.02,1.0));                                  // cool shadows
  col+=(h12(gl_FragCoord.xy*1.37)-.5)*.035;                          // film grain
  fragColor=vec4(clamp(col,0.,1.),1.);
}
`;

const LIME = "vec3(.78,.98,.34)";

const SCENES = {
  // ---------------------------------------------------------------- CADENCEFLOW
  // Chrome rings stand in a curving file into the fog; a lime pulse runs through
  // them and leaves lime marks on the rings it has passed: a cadence of touchpoints.
  cadenceflow: { w: 1920, h: 1280, src: `
#define NEAR .05
#define STEPS 220
#define STEPF .9
#define FAR 60.
#define FOGK .0016
#define GLOWK 24.
#define GLOWS 1.5
#define GLOWC ${LIME}*1.4
#define NORMALE .0006
#define EXPOSURE 1.0
vec3 pathP(float s){return vec3(sin(s*.5)*1.1,1.55,-s*2.4);}
float pathA(float s){return atan(cos(s*.5)*.55,2.4);}
vec2 map(vec3 p){
  vec2 res=vec2(p.y,3.);
  float pr=1e9;
  for(int i=0;i<9;i++){
    float s=float(i);
    vec3 q=p-pathP(s);
    q.xz=rot(pathA(s))*q.xz;
    float d=sdTorus(q.xzy,vec2(1.36,.034));
    if(d<res.x)res=vec2(d,1.);
    // a touchpoint on top of each ring: lime once the pulse has passed it
    vec3 k=q-vec3(.0,1.36,0.);
    float dot_=length(k)-.075;
    if(dot_<res.x)res=vec2(dot_,s<3.5?2.:4.);
    if(s<3.5)pr=min(pr,dot_);
  }
  float pl=1e9;
  for(int i=0;i<12;i++){float a=.7+float(i)*.27;pl=min(pl,sdCapsule(p,pathP(a),pathP(a+.27),.01+.022*float(i)/11.));}
  pl=min(pl,length(p-pathP(3.94))-.07);
  if(pl<res.x)res=vec2(pl,2.);
  gGlow=min(pl,pr);
  return res;
}
void camera(vec2 uv,out vec3 ro,out vec3 rd){
  ro=vec3(2.1,1.05,3.9);
  vec3 ta=vec3(-.5,1.55,-6.);
  vec3 w=normalize(ta-ro),u=normalize(cross(w,vec3(0,1,0))),v=cross(u,w);
  rd=normalize(uv.x*u+uv.y*v+1.65*w);
}
vec3 fogColor(vec3 rd,vec2 uv){return mix(vec3(.74,.76,.78),vec3(.88,.89,.9),smoothstep(-.2,.5,uv.y));}
vec3 background(vec3 rd,vec2 uv){return fogColor(rd,uv);}
vec3 shade(vec3 p,vec3 n,vec3 rd,float m){
  vec3 L=normalize(vec3(-.35,1.,.3));
  float ao=calcAO(p,n);
  float fr=pow(1.-max(dot(n,-rd),0.),5.);
  if(m<1.5){vec3 r=reflect(rd,n);return studio(r)*(.45+.55*fr)*(.35+.65*ao)*vec3(.95,.97,1.);}
  if(m<2.5)return ${LIME}*2.6;
  if(m>3.5)return vec3(.95)*(.6+.4*max(dot(n,L),0.));
  float sh=softShadow(p+n*.01,L,9.,14.);
  vec3 base=vec3(.58,.6,.62);
  vec3 r=reflect(rd,n);
  vec3 col=base*(.38+.62*max(dot(n,L),0.)*sh)*ao;
  return col+studio(r)*.06*fr;
}
` },

  // ---------------------------------------------------------- FINANCE PLATFORM
  // Black glossy steps climb away into the fog: the month planned ahead. A lime
  // line runs along their edges to a single point at the top: the goal.
  "finance-platform": { w: 1920, h: 1280, src: `
#define NEAR .05
#define STEPS 200
#define STEPF .9
#define FAR 40.
#define FOGK .003
#define GLOWK 34.
#define GLOWS 1.5
#define GLOWC ${LIME}*1.35
#define NORMALE .0006
#define EXPOSURE 1.0
vec3 stepC(float i){float a=.16*i;return vec3(i*.62-1.6,0.,-i*.95+sin(a)*.6);}
float stepH(float i){return .22+i*.2;}
vec3 lineP(float s){vec3 c=stepC(s);return vec3(c.x+.3,stepH(s)*2.+.05,c.z+.28);}
vec2 map(vec3 p){
  vec2 res=vec2(p.y,3.);
  for(int i=0;i<11;i++){
    float s=float(i);
    vec3 q=p-stepC(s);
    q.xz=rot(.62)*q.xz;
    float h=stepH(s);
    float d=sdRoundBox(q-vec3(0.,h,0.),vec3(.42,h,.42),.025);
    if(d<res.x)res=vec2(d,1.);
  }
  float pl=1e9;
  for(int i=0;i<20;i++){float a=float(i)*.5;pl=min(pl,sdCapsule(p,lineP(a),lineP(a+.5),.014));}
  float goal=length(p-lineP(10.))-.075;
  pl=min(pl,goal);
  if(pl<res.x)res=vec2(pl,2.);
  gGlow=pl;
  return res;
}
void camera(vec2 uv,out vec3 ro,out vec3 rd){
  ro=vec3(-2.9,.95,4.4);
  vec3 ta=vec3(1.5,2.,-4.6);
  vec3 w=normalize(ta-ro),u=normalize(cross(w,vec3(0,1,0))),v=cross(u,w);
  rd=normalize(uv.x*u+uv.y*v+1.7*w);
}
vec3 fogColor(vec3 rd,vec2 uv){return mix(vec3(.74,.76,.78),vec3(.9,.905,.91),smoothstep(-.25,.55,uv.y));}
vec3 background(vec3 rd,vec2 uv){return fogColor(rd,uv);}
vec3 shade(vec3 p,vec3 n,vec3 rd,float m){
  vec3 L=normalize(vec3(-.3,1.,.4));
  float ao=calcAO(p,n);
  float fr=.04+.96*pow(1.-max(dot(n,-rd),0.),5.);
  if(m<1.5){vec3 r=reflect(rd,n);return vec3(.012)+studio(r)*fr*.8*(.5+.5*ao);}
  if(m<2.5)return ${LIME}*2.8;
  float sh=softShadow(p+n*.01,L,9.,12.);
  vec3 base=vec3(.6,.62,.64);
  return base*(.42+.58*max(dot(n,L),0.)*sh)*ao;
}
` },

  // -------------------------------------------------------- LEGAL INTELLIGENCE
  // An archive of standing slabs, the pages of a case file; a lime laser reads
  // across all of them at one height, leaving a lit line on every page.
  "legal-intelligence": { w: 1920, h: 1280, src: `
#define NEAR .05
#define STEPS 220
#define STEPF .85
#define FAR 40.
#define FOGK .011
#define GLOWK 60.
#define GLOWS .12
#define GLOWC ${LIME}*1.2
#define NORMALE .0006
#define EXPOSURE 1.0
const float LASER=.86;
vec2 map(vec3 p){
  vec2 res=vec2(p.y,3.);
  vec3 q=p;
  float cx=.95,cz=.55;
  vec2 id=floor((q.xz+vec2(cx,cz)*.5)/vec2(cx,cz));
  q.xz-=vec2(cx,cz)*id;
  float hh=h12(id*1.7+.3);
  float ht=.62+.38*hh;
  float d=sdRoundBox(q-vec3(0.,ht,0.),vec3(.34,ht,.022),.008);
  d=max(d,abs(p.x-.6)-3.4);
  d=max(d,p.z-.3);
  d=max(d,-p.z-9.);
  d=min(d,max(min(cx*.5-abs(q.x),cz*.5-abs(q.z)),0.)+.01);
  if(d<res.x)res=vec2(d,hh>.92?4.:1.);
  gGlow=abs(p.y-LASER)+10.*max(0.,abs(p.x-.6)-3.3)+10.*max(0.,p.z-.25);
  return res;
}
void camera(vec2 uv,out vec3 ro,out vec3 rd){
  ro=vec3(-3.3,1.95,3.6);
  vec3 ta=vec3(1.,.7,-3.2);
  vec3 w=normalize(ta-ro),u=normalize(cross(w,vec3(0,1,0))),v=cross(u,w);
  rd=normalize(uv.x*u+uv.y*v+1.75*w);
}
vec3 fogColor(vec3 rd,vec2 uv){return mix(vec3(.75,.765,.78),vec3(.9,.905,.91),smoothstep(-.3,.5,uv.y));}
vec3 background(vec3 rd,vec2 uv){return fogColor(rd,uv);}
vec3 shade(vec3 p,vec3 n,vec3 rd,float m){
  vec3 L=normalize(vec3(-.4,1.,.5));
  float ao=calcAO(p,n);
  float sh=softShadow(p+n*.01,L,12.,8.);
  float dif=max(dot(n,L),0.);
  float scan=smoothstep(.012,.0,abs(p.y-LASER));
  if(m<1.5||m>3.5){
    vec3 base=m>3.5?vec3(.05,.052,.055):vec3(.9,.9,.905);
    vec3 col=base*(.45+.55*dif*sh)*(.45+.55*ao);
    vec3 r=reflect(rd,n);
    col+=studio(r)*(m>3.5?.08:.03)*pow(1.-max(dot(n,-rd),0.),3.);
    return col+${LIME}*3.2*scan;
  }
  vec3 base=vec3(.62,.635,.65);
  return base*(.42+.58*dif*sh)*ao;
}
` },

  // ------------------------------------------------- AUTOMATION INFRASTRUCTURE
  // A lattice of nodes and links receding into fog; some links are missing,
  // a few nodes are lit, and pulses travel the links between them.
  "automation-infrastructure": { w: 1920, h: 1280, src: `
#define NEAR .05
#define STEPS 240
#define STEPF .8
#define FAR 34.
#define FOGK .016
#define GLOWK 28.
#define GLOWS .9
#define GLOWC ${LIME}*1.25
#define NORMALE .0005
#define EXPOSURE 1.0
const float C=2.2;
mat3 R3;
vec2 map(vec3 p){
  p=R3*p;
  vec3 id=floor(p/C+.5);
  vec3 q=p-C*id;
  float hn=h13(id);
  float r=.07+.11*hn*hn;
  float node=length(q)-r;
  vec2 res=vec2(node,hn>.93?2.:1.);
  float glow=1e9;
  // links along +x/-x, +y/-y, +z/-z; a link exists when its hash says so
  for(int a=0;a<3;a++){
    vec3 ax=a==0?vec3(1,0,0):a==1?vec3(0,1,0):vec3(0,0,1);
    float side=dot(q,ax)>0.?0.:-1.;
    vec3 eid=id+ax*side;
    float he=h13(eid*1.3+ax*7.1);
    if(he<.46){
      vec2 o=a==0?q.yz:a==1?q.xz:q.xy;
      float d=length(o)-.012;
      if(d<res.x)res=vec2(d,3.);
      // a pulse on some links, centred on the link (the cell boundary)
      if(he<.14){
        float along=abs(dot(q,ax));
        float pd=length(vec2(length(o),max(abs(along-C*.5)-.16,0.)))-.022;
        if(pd<res.x)res=vec2(pd,2.);
        glow=min(glow,pd);
      }
    }
  }
  gGlow=glow;
  res.x*=.9;
  return res;
}
void camera(vec2 uv,out vec3 ro,out vec3 rd){
  float a=.55,b=.35;
  R3=mat3(cos(a),0.,sin(a),0.,1.,0.,-sin(a),0.,cos(a))*mat3(1.,0.,0.,0.,cos(b),-sin(b),0.,sin(b),cos(b));
  ro=vec3(.5,.35,3.6);
  vec3 ta=vec3(-.8,-.2,-4.);
  vec3 w=normalize(ta-ro),u=normalize(cross(w,vec3(0,1,0))),v=cross(u,w);
  rd=normalize(uv.x*u+uv.y*v+1.5*w);
}
vec3 fogColor(vec3 rd,vec2 uv){return mix(vec3(.72,.74,.76),vec3(.88,.89,.9),smoothstep(-.4,.5,uv.y));}
vec3 background(vec3 rd,vec2 uv){return fogColor(rd,uv);}
vec3 shade(vec3 p,vec3 n,vec3 rd,float m){
  float fr=pow(1.-max(dot(n,-rd),0.),5.);
  vec3 r=reflect(rd,n);
  if(m<1.5)return studio(r)*(.06+.94*fr)*.55+vec3(.02);
  if(m<2.5)return ${LIME}*2.8;
  return vec3(.16,.17,.18)+studio(r)*.12*fr;
}
` },

  // ---------------------------------------------------------------------- WALL
  // The work section's wall: black liquid forms with a wet, crinkled skin at
  // the edges of a pale grey field, so the black panel sits in the clear middle.
  // A 2.5D relief: a height field shaded as glossy black under the studio.
  wall: { w: 2400, h: 1600, custom: true, src: `
vec2 map(vec3 p){return vec2(1e9,0.);} // unused: this scene is not ray-marched
float n2(vec2 p){return gn(vec3(p,.37));}
float rid(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){float n=1.-abs(n2(p)*1.7);s+=a*n*n;p=p*2.07+vec2(3.1,1.7);a*=.5;}return s;}
float fb(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*n2(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
// > 0 inside the forms
float mask(vec2 p){
  float right=(p.x-(1.32+.22*sin(p.y*1.1+.4)+.55*fb(p*vec2(.7,.45)+2.)))*2.6;
  vec2 l=(p-vec2(-2.7,-.38))*vec2(1.,1.25);
  float left=(.7-length(l)+.75*fb(p*2.1+7.)+.25*fb(p*5.+1.))*2.6;
  return max(right,left);
}
// The wall's light: dim surroundings, a large softbox above and toward the
// viewer (so crinkles facing up-left catch it), a thin strip from the right.
vec3 wallEnv(vec3 r){
  vec3 c=mix(vec3(.04),vec3(.3),smoothstep(-.2,.8,r.y));
  c+=vec3(7.5)*smoothstep(.8,.92,dot(r,normalize(vec3(-.25,.55,.8))));
  c+=vec3(2.5)*smoothstep(.95,.985,dot(r,normalize(vec3(.9,.2,.4))));
  return c;
}
// Ridges that flow diagonally, like liquid running down a rock face.
float height(vec2 p){
  float m=smoothstep(0.,.55,mask(p));
  vec2 s=vec2(p.x*1.1+p.y*.75,p.y*.45-p.x*.2);
  return m*(.2+.8*rid(s*1.1))+m*.025*fb(p*6.);
}
vec3 shadeAt(vec2 p){
  float e=.0016;
  vec3 n=normalize(vec3(height(p-vec2(e,0.))-height(p+vec2(e,0.)),height(p-vec2(0.,e))-height(p+vec2(0.,e)),2.*e/.28));
  vec3 rd=vec3(0.,0.,-1.);
  vec3 r=reflect(rd,n);
  float fr=.06+.94*pow(1.-max(dot(n,-rd),0.),5.);
  vec3 ink=vec3(.006)+wallEnv(r)*fr;
  vec3 bg=mix(vec3(.8,.805,.81),vec3(.865,.87,.875),smoothstep(-1.4,1.4,p.y));
  float m=mask(p);
  bg*=1.-.18*exp(-max(-m,0.)*3.);
  return mix(bg,ink,smoothstep(-.02,.06,m));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec3 col=aces(shadeAt(uv*4.2)*1.08);
  col+=(h12(gl_FragCoord.xy*1.37)-.5)*.03;
  fragColor=vec4(clamp(col,0.,1.),1.);
}
` },
};

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
const log = (m) => (document.getElementById("log").textContent = m);

function program(src) {
  const sh = (type, s) => {
    const o = gl.createShader(type);
    gl.shaderSource(o, s);
    gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
    return o;
  };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, "#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, src));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const frame = () => new Promise((r) => setTimeout(r, 0));

// The GL canvas renders at ss× the target size; `out` holds the scaled-down image.
const out = document.createElement("canvas");
out.style.cssText = canvas.style.cssText;
canvas.after(out);
canvas.style.display = "none";

// render("cadenceflow", { scale: .5, ss: 1 }) for a quick look; defaults to the final size.
async function render(name, { scale = 1, ss = 2, tile = 128 } = {}) {
  const s = SCENES[name];
  const prog = program(PRELUDE + s.src + (s.custom ? "" : POST));
  gl.useProgram(prog);
  const loc = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const w = Math.round(s.w * scale), h = Math.round(s.h * scale);
  const W = w * ss, H = h * ss;
  canvas.width = W;
  canvas.height = H;
  gl.viewport(0, 0, W, H);
  gl.uniform2f(gl.getUniformLocation(prog, "uRes"), W, H);
  gl.enable(gl.SCISSOR_TEST);
  const t0 = performance.now();
  let n = 0;
  const total = Math.ceil(W / tile) * Math.ceil(H / tile);
  for (let y = 0; y < H; y += tile)
    for (let x = 0; x < W; x += tile) {
      gl.scissor(x, y, tile, tile);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.finish();
      if (++n % 6 === 0) {
        log(`${name}: ${n}/${total}`);
        await frame();
      }
    }
  gl.disable(gl.SCISSOR_TEST);
  out.width = w;
  out.height = h;
  const ctx = out.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(canvas, 0, 0, W, H, 0, 0, w, h);
  const ms = Math.round(performance.now() - t0);
  log(`${name}: done ${w}x${h} ss${ss} in ${ms}ms`);
  return { w, h, ms };
}

// Kick a render off and return at once; poll with status().
function start(name, opts) {
  window.__res = null;
  render(name, opts).then((r) => (window.__res = r), (e) => (window.__res = String(e).slice(0, 800)));
  return "started";
}
const status = () => ({ res: window.__res, log: document.getElementById("log").textContent });

async function save(name, quality = 0.86) {
  const blob = await new Promise((r) => out.toBlob(r, "image/webp", quality));
  const res = await fetch(`/save?name=${name}.webp`, { method: "POST", body: blob });
  const msg = `${await res.text()} (${Math.round(blob.size / 1024)} KB)`;
  log(msg);
  return msg;
}

window.render = render;
window.start = start;
window.status = status;
window.save = save;
window.SCENES = SCENES;
</script>
</body>
